name: Release Obsidian Plugin
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - '*' # Push events to matching any tag format, i.e. 1.0, 20.15.10

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: npm

    - name: Build
      run: |
        npm ci
        npm run build

    - name: Check version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION="$(node -p "require('./manifest.json').version")"
        if [ "$VERSION" != "$TAG" ]; then
          echo "::error::Tag $TAG does not match manifest.json version $VERSION"
          exit 1
        fi

    - name: Package
      env:
        TAG: ${{ github.ref_name }}
        NAME: ${{ github.event.repository.name }}
      run: |
        mkdir "$NAME"
        cp main.js manifest.json styles.css README.md "$NAME"
        zip -r "$NAME-$TAG.zip" "$NAME"

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        NAME: ${{ github.event.repository.name }}
      run: |
        gh release create "$TAG" --title "$TAG" --verify-tag \
          main.js manifest.json styles.css "$NAME-$TAG.zip"
